services:
 # 1. Contenedor del Backend (Laravel)
  laravel-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sistema_prestamos_app
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    command: ["tail", "-f", "/dev/null"]
    networks:
      - red-prestamos
    depends_on:
      - postgres-db
      - mongo-db
  # 2. Base de Datos Relacional (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine
    container_name: sistema_prestamos_postgres
    restart: always
    environment:
      POSTGRES_DB: cashea_borrow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - db_postgres_data:/var/lib/postgresql/data
    networks:
      - red-prestamos

  # 3. Base de Datos NoSQL / Documental (MongoDB)
  mongo-db:
    image: mongo:6.0
    container_name: sistema_prestamos_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - db_mongo_data:/data/db
    networks:
      - red-prestamos

networks:
  red-prestamos:
    driver: bridge

volumes:
  db_postgres_data:
  db_mongo_data: